name: Docker Image CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
